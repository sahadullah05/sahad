<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LinkedIn Sign Up Clone</title>
    <link rel="stylesheet" href="styles.css/signin.css">
</head>

<body>
    <header class="header">
        <img src="https://assets.turbologo.com/blog/en/2025/03/21134124/logo-Linkedin-958x575.png" alt="LinkedIn Logo"
            class="logo">
    </header>

    <main class="container">
        <h1>Join LinkedIn now — it's free!</h1>

        <div class="card">
            <form>
                <div class="input-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" name="email">
                </div>

                <div class="input-group">
                    <label for="password">Password</label>
                    <div class="password-wrapper">
                        <input type="password" id="password" name="password">
                        <span class="show-btn">Show</span>
                    </div>
                </div>

                <div class="checkbox-group">
                    <input type="checkbox" id="remember" checked>
                    <label for="remember">Remember me</label>
                </div>

                <p class="policy-text">
                    By clicking Agree & Join or Continue, you agree to the LinkedIn
                    <a href="#">User Agreement</a>, <a>Privacy Policy</a>, and <a href="#">Cookie Policy</a>.
                </p>

                <button type="submit" class="agree-btn"> <a
                        href="file:///C:/Users/AST/Desktop/Smit%20Batch20/javascript/linkedin/profile.html">Agree &
                        Join</a></button>
            </form>

            <div class="divider">
                <span>or</span>
            </div>

            <div class="social-auth">
                <button class="social-btn">
                    <img src="https://www.google.com/favicon.ico" alt=""> Continue with Google
                </button>
                <button class="social-btn">
                    <img src="" alt=""> Continue with Microsoft
                </button>
            </div>

            <p class="footer-link">Already on LinkedIn? <a href="#">Sign in</a></p>
        </div>

        <p class="business-help">Looking to create a page for a business? <a href="#">Get help</a></p>
    </main>
</body>

</html>
