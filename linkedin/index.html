<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LinkedIn Login Clone</title>
    <link rel="stylesheet" href="./styles.css/login.css">
</head>

<body>
    <nav class="navbar">
        <div class="logo">
            <img src="https://assets.turbologo.com/blog/en/2025/03/21134124/logo-Linkedin-958x575.png"
                alt="LinkedIn Logo">
        </div>
        <div class="nav-links">
            <div class="nav-item"><span>Top Content</span></div>
            <div class="nav-item"><span>People</span></div>
            <div class="nav-item"><span>Learning</span></div>
            <div class="nav-item"><span>Jobs</span></div>
            <div class="nav-item"><span>Games</span></div>
            <div class="nav-item"><span>Get the app</span></div>
            <div class="auth-buttons">
                <button class="btn-secondary"> <a href="file:///C:/Users/AST/Desktop/Smit%20Batch20/javascript/linkedin/signin.html"> Sign in
                    </a></button>
                <button class="btn-primary">Join now</button>
            </div>
        </div>
    </nav>

    <main class="hero">
        <section class="login-section">
            <h1>Welcome to your professional community</h1>
            <div class="social-login">
                <button class="social-btn">
                    <img src="https://www.google.com/favicon.ico" alt=""> Continue with Google
                </button>
                <button class="social-btn">
                    <img src="" alt=""> Continue with Microsoft
                </button>
                <button class="social-btn email-btn">Sign in with email</button>
            </div>
            <p class="terms">By clicking Continue to join or sign in, you agree to LinkedIn’s <a href="#">User
                    Agreement</a>, <a href="#">Privacy Policy</a>, and <a href="#">Cookie Policy</a>.</p>
            <p class="join-link">New to LinkedIn? <a href="#">Join now</a></p>
        </section>

        <section class="image-section">
            <div class="illustration-placeholder">
                <img src="https://static.licdn.com/aero-v1/sc/h/dxf91zhqd2z6b0bwg85ktm5s4"
                    alt="Professional illustration">
            </div>
        </section>
    </main>
</body>

</html>
